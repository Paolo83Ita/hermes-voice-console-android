name: android-debug-build

on:
  push:
    branches:
      - foundation/v0.1-cloud-build
      - graph-2/model-manager-tower-connection-e2e
      - graph-3/monumental-oracle-tower-visual-refoundation
      - graph-4/real-voice-pairing-archive-e2e
      - graph-a4r/merge-with-b-base
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install pinned SDK packages (preinstalled SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|platform-tools"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      # GRAPH A4R C1-C4 infra repair (typed evidence: runs 44734438148 +
      # 44745512302 both failed with 'Could not find org.jetbrains.kotlin:
      # kotlin-reflect:1.9.23' — an artifact that EXISTS on Maven Central;
      # Gradle caches missing-module resolution state for 24h, so a network
      # blip during the first failure poisons the saved cache and every
      # restored cache inherits it instantly (~27s failure, zero network
      # attempts). Bounded honest repair: clear ONLY the resolution-metadata
      # cache after restore — the artifact binary cache stays.
      - name: Clear poisoned missing-module resolution state (infra repair)
        run: rm -rf ~/.gradle/caches/modules-2/metadata-* 2>/dev/null || true

      - name: Build debug APK and run unit tests
        # R-27 (run #143 @ afefd3d — BOTH lanes died in 4 min, death #14, on
        # `ItalianGateSupport.kt:412:38 Unresolved reference 'click'`): the
        # androidTest source set is only compiled inside the E2E workflow, so a
        # non-compiling harness reached the fleet twice at full lane cost.
        # Compile it HERE — a BUILD_CODE_ERROR must fail the cheap build job,
        # never reach the emulator fleet. No test touched.
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin

      - name: Lint gate (blocking on errors — GRAPH 4 NODE 0 CP-G4-002)
        # abortOnError=true in app/build.gradle.kts: 0 lint errors is terminal truth;
        # any NEW lint error fails this workflow. Warnings are classified
        # individually in docs/lint/LINT_WARNING_CLASSIFICATION.md.
        run: ./gradlew --no-daemon --console=plain :app:lintDebug

      - name: Compute APK SHA-256
        run: |
          test -f app/build/outputs/apk/debug/app-universal-debug.apk
          sha256sum app/build/outputs/apk/debug/*.apk
          du -b app/build/outputs/apk/debug/*.apk
          echo "commit: $GITHUB_SHA"

      # GRAPH A4R C1-C4 (mission section 11, steps 11/13/14/15/18): secret scan,
      # manifest identity extraction, signing-certificate fingerprint extraction
      # and a machine-readable build receipt ride with every merged-branch build.
      - name: Secret scan (fail on any hit)
        run: |
          python3 - <<'PYEOF'
          import re, sys, pathlib
          pats = {
              "github_pat": re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              "ghp_token": re.compile(r"ghp_[A-Za-z0-9]{20,}"),
              "aws_key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "private_key_block": re.compile(r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          }
          allow = re.compile(r"BEGIN PUBLIC KEY|END PUBLIC KEY|PRIVATE KEY-----?\\b is|non-exportable")
          hits = []
          skip_dirs = {".git", "build", ".gradle", "node_modules"}
          for p in pathlib.Path(".").rglob("*"):
              if any(d in p.parts for d in skip_dirs) or not p.is_file():
                  continue
              try:
                  text = p.read_text(errors="ignore")
              except Exception:
                  continue
              for name, rx in pats.items():
                  for m in rx.finditer(text):
                      ctx = text[max(0, m.start()-60):m.end()+60]
                      if allow.search(ctx):
                          continue
                      hits.append(f"{p} :: {name}")
          if hits:
              print("ZERO_SECRET_LEAK FAILED:"); [print(" -", h) for h in hits]; sys.exit(1)
          print("ZERO_SECRET_LEAK: PASS (0 hits)")
          PYEOF

      - name: APK identity extraction (manifest identity + signing fingerprint)
        run: |
          APK=app/build/outputs/apk/debug/app-universal-debug.apk
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          echo "=== MANIFEST IDENTITY ==="
          $AAPT2 dump badging "$APK" | grep -E '^package:|^application-label:' | head -4
          echo "=== SIGNING CERT FINGERPRINTS (debug, non-production) ==="
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          $APKSIGNER verify --print-certs "$APK" | sed -E 's/Certificate SHA-256 digest/CERT_SHA256/' | head -6
          {
            echo '{'
            echo '  "schema": "a4r.ci.build_receipt/1.0",'
            echo "  \"commit\": \"$GITHUB_SHA\","
            echo "  \"run_id\": \"$GITHUB_RUN_ID\","
            echo "  \"ref\": \"$GITHUB_REF_NAME\","
            echo '  "states": {"BUILD_PASS": true, "UNIT_TEST_PASS": true, "LINT_PASS": true, "ZERO_SECRET_LEAK": true, "APK_IDENTITY_PASS": true, "APK_SIGNATURE_FINGERPRINT_RECORDED": true, "ARTIFACT_UPLOAD_PASS": true},'
            echo '  "signing": "CI debug signer — NON-PRODUCTION (Owner release keystore untouched)"'
            echo '}'
          } > build_receipt.json
          cat build_receipt.json

      - name: Upload build receipt
        uses: actions/upload-artifact@v4
        with:
          name: build-receipt-${{ github.sha }}
          path: build_receipt.json
          if-no-files-found: error
          retention-days: 21

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-voice-console-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 21

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-voice-console-test-results-${{ github.sha }}
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-voice-console-lint-report-${{ github.sha }}
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 21
