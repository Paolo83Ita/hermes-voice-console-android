name: android-debug-build

on:
  push:
    branches:
      - foundation/v0.1-cloud-build
      - graph-2/model-manager-tower-connection-e2e
      - graph-3/monumental-oracle-tower-visual-refoundation
      - graph-4/real-voice-pairing-archive-e2e
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install pinned SDK packages (preinstalled SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|platform-tools"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest

      - name: Lint gate (blocking on errors — GRAPH 4 NODE 0 CP-G4-002)
        # abortOnError=true in app/build.gradle.kts: 0 lint errors is terminal truth;
        # any NEW lint error fails this workflow. Warnings are classified
        # individually in docs/lint/LINT_WARNING_CLASSIFICATION.md.
        run: ./gradlew --no-daemon --console=plain :app:lintDebug

      - name: Compute APK SHA-256
        run: |
          test -f app/build/outputs/apk/debug/app-universal-debug.apk
          sha256sum app/build/outputs/apk/debug/*.apk
          du -b app/build/outputs/apk/debug/*.apk
          echo "commit: $GITHUB_SHA"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-voice-console-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 21

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-voice-console-test-results-${{ github.sha }}
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 21

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-voice-console-lint-report-${{ github.sha }}
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 21
