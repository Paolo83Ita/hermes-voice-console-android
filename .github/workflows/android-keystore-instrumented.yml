name: android-keystore-instrumented

# GRAPH A4R C1-C4 (CP-A4R-C1-006, mission sections 5/11): the REAL
# AndroidKeyStore instrumentation lane. The JVM suite NEVER simulates the
# keystore (A4R-P1-002 discipline) — the keystore path is exercised HERE on a
# real Android emulator (API 34 x86_64, software keystore).
#
# RECORDED GATE: SOFTWARE_ANDROID_KEYSTORE_TESTED.
# The claim HARDWARE_BACKED_KEYSTORE_PASS is NOT made from this workflow and
# stays reserved for the Xiaomi physical mini-gate (mission section 5).
#
# Classes under test (exactly the A2 repair suite + the device identity):
#  - com.hermestower.voiceconsole.data.TowerStoreInstrumentedTest (9 tests:
#    first-install round-trip, restart persistence, key-loss invalidation,
#    corrupted ciphertext wipe, malformed framing, atomic commit success,
#    no-partial-state commit, QR/numeric store parity, AES-256 + fresh IV)
#  - com.hermestower.voiceconsole.pairing.DeviceKeysInstrumentedTest (3 tests:
#    secp256r1 key creation, SHA256withECDSA sign/verify, attestation metadata)

on:
  push:
    branches:
      - graph-a4r/merge-with-b-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install pinned SDK packages (preinstalled SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-34;google_apis;x86_64" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|system-images;android-34"

      - name: Check hardware acceleration availability
        run: |
          ls -l /dev/kvm || echo "NO KVM — emulator will run with software acceleration (slower boot)"

      # GRAPH A4R C1-C4 infra repair (typed evidence: runs 44734438148 + 44735713527
      # both died at emulator launch — emulator 37.3.10.0 refuses software CPU
      # emulation and could not USE /dev/kvm despite the node existing root:kvm 660;
      # the runner allocation did not grant the process kvm access). Bounded,
      # honest repair: widen the KVM device permission before the emulator step
      # (passwordless sudo is standard on hosted runners). If KVM still is not
      # writable, the lane aborts honestly at boot (typed, no blind retry).
      - name: Ensure KVM access (infra repair for the evidenced emulator-launch collapse)
        run: |
          groups
          sudo chmod 666 /dev/kvm || true
          sudo usermod -aG kvm "$USER" || true
          ls -l /dev/kvm
          if [ -w /dev/kvm ]; then echo "KVM_WRITABLE"; else echo "KVM_NOT_WRITABLE — the lane will abort honestly at emulator boot (typed INSTRUMENTATION_BLOCKED)"; fi

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build application and test APKs
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run REAL AndroidKeyStore instrumentation (API 34, x86_64, headless)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 2400
          install: false
          pre-emulator-launch-script: |
            sed -i 's/disk.dataPartition.size=6G/disk.dataPartition.size=2048M/' ~/.android/avd/test.avd/config.ini || true
            sed -i 's/disk.dataPartition.size=8G/disk.dataPartition.size=2048M/' ~/.android/avd/test.avd/config.ini || true
          script: |
            adb devices
            timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
            sleep 60
            echo "R-17-style guest health gate (package service probe)"
            if timeout 60 adb shell pm list packages >/dev/null 2>&1; then
              echo "GUEST_HEALTH_OK"
            else
              echo "GUEST_COLLAPSE: typed honest abort (no blind retry)"; exit 1
            fi
            echo "Installing APKs for the keystore lane..."
            adb install -r app/build/outputs/apk/debug/app-universal-debug.apk || exit 1
            adb install -r app/build/outputs/apk/androidTest/debug/app-universal-debug-androidTest.apk || exit 1
            echo "SOFTWARE_ANDROID_KEYSTORE_TESTED: running the REAL keystore suite..."
            ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.hermestower.voiceconsole.data.TowerStoreInstrumentedTest,com.hermestower.voiceconsole.pairing.DeviceKeysInstrumentedTest

      - name: Upload keystore instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keystore-instrumentation-results-${{ github.sha }}
          path: app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 21

      - name: Record the typed gate receipt
        if: success()
        run: |
          cat > SOFTWARE_ANDROID_KEYSTORE_TESTED.txt <<'EOF'
          GATE: ANDROID_KEYSTORE_INSTRUMENTATION_PASS
          RECORDED_AS: SOFTWARE_ANDROID_KEYSTORE_TESTED
          SCOPE: TowerStoreInstrumentedTest (9) + DeviceKeysInstrumentedTest (3) on emulator API 34 x86_64
          NOT_CLAIMED: HARDWARE_BACKED_KEYSTORE_PASS (reserved for the Xiaomi physical mini-gate P1-P8)
          EOF
          cat SOFTWARE_ANDROID_KEYSTORE_TESTED.txt

      - name: Upload the gate receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SOFTWARE_ANDROID_KEYSTORE_TESTED-${{ github.sha }}
          path: SOFTWARE_ANDROID_KEYSTORE_TESTED.txt
          if-no-files-found: error
          retention-days: 21
