name: android-e2e

on:
  push:
    branches:
      - graph-2/model-manager-tower-connection-e2e
      - graph-3/monumental-oracle-tower-visual-refoundation
      - graph-4/real-voice-pairing-archive-e2e
      - main
  workflow_dispatch:
    inputs:
      e2e_profile:
        description: 'E2E variant: NORMAL = normal visual profile (frozen clock); LIFECYCLE = CI_LIFECYCLE_PROFILE (ornaments frozen in-app, real clock, physical clicks)'
        type: choice
        options:
          - NORMAL
          - LIFECYCLE
        default: NORMAL
      e2e_class_filter:
        description: 'JUnit -e class filter (empty = full suite), e.g. com.hermestower.voiceconsole.e2e.E2EAppearancePersistenceTest#e2e_35_36_switchMarbleLightAndObsidianNight'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  emulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install pinned SDK packages (preinstalled SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-34;google_apis;x86_64" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|system-images;android-34"

      - name: Free disk space for the emulator AVD
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk* /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/Code.Tool 2>/dev/null || true
          sudo docker image prune -a -f > /dev/null 2>&1 || true
          df -h /

      - name: Check hardware acceleration availability
        run: |
          ls -l /dev/kvm || echo "NO KVM — emulator will run with software acceleration (slower boot)"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build application and test APKs
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run emulator end-to-end suite (API 34, x86_64, headless)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_PROFILE: ${{ inputs.e2e_profile || 'NORMAL' }}
          E2E_CLASS_FILTER: ${{ inputs.e2e_class_filter }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 2400
          install: false
          pre-emulator-launch-script: |
            echo "AVD config before edit:"
            cat ~/.android/avd/test.avd/config.ini || true
            sed -i 's/disk.dataPartition.size=6G/disk.dataPartition.size=2048M/' ~/.android/avd/test.avd/config.ini || true
            sed -i 's/disk.dataPartition.size=8G/disk.dataPartition.size=2048M/' ~/.android/avd/test.avd/config.ini || true
            echo "AVD config after edit:"
            grep -E "dataPartition|cachePartition" ~/.android/avd/test.avd/config.ini || true
          script: |
            adb devices
            # Post-boot settle: wait for boot flag, then give the package manager
            # time to finish first-boot finalization on the software-emulated device.
            timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
            sleep 60
            adb shell getprop ro.build.version.sdk
            echo "Installing application APK..."
            # CP-G4-023 fix 2 (runs 41884838553 @ c97a02f + 41883447613 @ 6545969 —
            # boot 17.4 min, then `adb: failed to stat app-debug.apk: No such file
            # or directory`): the CP-G4-021 ABI splits RENAMED the outputs — the
            # universal APK is now app-universal-debug.apk (app-debug.apk no longer
            # exists). The universal carries x86_64 (this emulator) + every ABI.
            # GRAPH 4.6 (GRAPH46_READBACK §2): installs stay bounded.
            timeout 900 adb install -r -t app/build/outputs/apk/debug/app-universal-debug.apk
            echo "Installing androidTest APK..."
            timeout 900 adb install -r -t $(ls app/build/outputs/apk/androidTest/debug/*androidTest*.apk | head -1)
            echo "Running instrumentation — segmented model (CP-G4-017 final)... profile=$E2E_PROFILE class_filter=${E2E_CLASS_FILTER:-<three-invocation model>}"
            # emulator-runner executes this script with /bin/sh (dash). The previous
            # bash-only `set -o pipefail` exited 2 before am instrument could start.
            # POSIX-safe: capture to file, echo it, classify the result.
            # CP-G4-016 (runs 41657209419/41657223032): the runner executes this
            # script ONE LINE PER `sh -c` — a shell VARIABLE built on one line is
            # DEAD by the next line. Both runs executed am instrument with EMPTY
            # args (numtests=31 despite a single-test -e class filter request; the
            # engagement probe printed ciLifecycleProfile=false) — neither the
            # class filter nor `-e lifecycleProfile true` EVER reached the device,
            # silently invalidating every dispatched experiment up to this repair.
            # CONSTRUCTION AND CONSUMPTION MUST SHARE ONE LINE.
            #
            # CP-G4-017 FINAL — SEGMENTED INSTRUMENTATION MODEL (directive §4 +
            # ITALIAN_GATE_NAVIGATION_FAILURE_LEDGER R-5/R-6): the dispositioned
            # lifecycle residual (NavBackStackEntry INITIALIZED→DESTROYED at
            # activity destroy, PHYSICAL_XIAOMI_RECOVERY_REQUIRED) crashes the
            # instrumentation PROCESS, destroying every later class's evidence.
            # Repair = crash-quarantine BY INVOCATION — nothing deleted, weakened
            # or bypassed:
            #   1) GATE: ONE INVOCATION PER CLASS (fix 4, run 41910303552: the
            #      software fleet DIED twice mid-gate (adb: device offline at
            #      ~100-110 min of the step) — a single 6-class instrument can
            #      never complete; per-class invocations give every segment
            #      independent evidence and the offline-guard stops the loop fast.
            #      ITALIAN_UI_COMPLETE requires EVERY gate class file to show
            #      'OK (… tests)' — missing evidence is NOT success;
            #   2) REGRESSION: ONE INVOCATION PER CLASS (Graph 4.6 R-11, run
            #      41868118783: the residual crashed E2EFreshInstallTest at
            #      e2e_03_04 — it is CLASS-INDEPENDENT and route-independent, so a
            #      single monolithic regression invocation can never carry the
            #      evidence of the classes ordered after the crash). Per-class
            #      classification: 'OK (… tests)' → pass; the dispositioned
            #      residual signature → typed INFRASTRUCTURE_FAILURE (recorded,
            #      does NOT fail the job — it is the dispositioned emulator
            #      residual awaiting physical arbitration); ANY other outcome
            #      FAILS the job. No test is deleted, skipped or weakened.
            #   3) RESIDUAL invocation: the dispositioned class alone — EXPECTED to
            #      show exactly the dispositioned signature (or pass when
            #      hardware-era code changes make it obsolete); ANY OTHER
            #      signature fails the job. Timeout 900 s (run 41868118783:
            #      e2e_41_42 passed and e2e_40 was mid-recreate when 600 s cut —
            #      the recreate+idle physics need headroom on software emulation).
            # Dispatch with e2e_class_filter keeps the EXACT old single-invocation
            # contract for the lifecycle experiments (TEST-A..E channel, §2).
            if [ -n "$E2E_CLASS_FILTER" ]; then IA=""; if [ "$E2E_PROFILE" = "LIFECYCLE" ]; then IA="$IA -e lifecycleProfile true"; fi; timeout 3600 adb shell am instrument -w -r $IA -e class "$E2E_CLASS_FILTER" com.hermestower.voiceconsole.test/androidx.test.runner.AndroidJUnitRunner > experiment-output.txt 2>&1; cat experiment-output.txt; fi
            if [ -z "$E2E_CLASS_FILTER" ]; then GOK=0; GBAD=""; for C in com.hermestower.voiceconsole.e2e.ItalianGateA_OnboardingConsoleTest com.hermestower.voiceconsole.e2e.ItalianGateB_ChatHistoryArchiveTest com.hermestower.voiceconsole.e2e.ItalianGateC_TowerGateQrScannerTest com.hermestower.voiceconsole.e2e.ItalianGateD_ModelsAndVoiceTest com.hermestower.voiceconsole.e2e.ItalianGateE_SettingsAppearanceLanguageTest com.hermestower.voiceconsole.e2e.ItalianGateF_DiagnosticsSelfTestAboutTest; do if ! adb get-state >/dev/null 2>&1; then echo "DEVICE_OFFLINE_ABORT — remaining gate classes have no runnable device (typed E2E_BLOCKED_EMULATOR_ENVIRONMENT)"; break; fi; F="gate_$(echo "$C" | sed 's/.*ItalianGate//;s/_.*//').txt"; timeout 900 adb shell am instrument -w -r -e class "$C" com.hermestower.voiceconsole.test/androidx.test.runner.AndroidJUnitRunner > "$F" 2>&1; cat "$F"; if grep -q 'OK ([0-9][0-9]* tests)' "$F"; then GOK=$((GOK+1)); else GBAD="$GBAD $C"; fi; done; echo "GATE_TALLY classes_ok=$GOK of 6 classes_failed:[$GBAD]"; fi
            if [ -z "$E2E_CLASS_FILTER" ]; then RC_OK=0; RC_RESIDUAL=0; RC_FAILED=""; for C in com.hermestower.voiceconsole.e2e.E2EFreshInstallTest com.hermestower.voiceconsole.e2e.E2ELifecycleProfileTest com.hermestower.voiceconsole.e2e.E2EModelManagerTest com.hermestower.voiceconsole.e2e.E2EOnboardingTest com.hermestower.voiceconsole.e2e.E2ESelfTestTest com.hermestower.voiceconsole.e2e.E2EVoiceFlowTest; do if ! adb get-state >/dev/null 2>&1; then echo "DEVICE_OFFLINE_ABORT — remaining regression classes have no runnable device (typed E2E_BLOCKED_EMULATOR_ENVIRONMENT)"; break; fi; F="regression_$(echo "$C" | sed 's/.*\.//').txt"; IA=""; if [ "$E2E_PROFILE" = "LIFECYCLE" ]; then IA="-e lifecycleProfile true"; fi; timeout 600 adb shell am instrument -w -r $IA -e class "$C" com.hermestower.voiceconsole.test/androidx.test.runner.AndroidJUnitRunner > "$F" 2>&1; cat "$F"; if grep -q 'OK ([0-9][0-9]* tests)' "$F"; then RC_OK=$((RC_OK+1)); elif grep -qE 'State must be at least CREATED to move to DESTROYED' "$F"; then RC_RESIDUAL=$((RC_RESIDUAL+1)); else RC_FAILED="$RC_FAILED $C"; fi; done; echo "REGRESSION_TALLY classes_ok=$RC_OK classes_residual_typed=$RC_RESIDUAL classes_failed:[$RC_FAILED]"; fi
            if [ -z "$E2E_CLASS_FILTER" ]; then timeout 900 adb shell am instrument -w -r -e class com.hermestower.voiceconsole.e2e.E2EAppearancePersistenceTest com.hermestower.voiceconsole.test/androidx.test.runner.AndroidJUnitRunner > residual-output.txt 2>&1; cat residual-output.txt; fi
            # Evidence capture INSIDE the script step: the runner tears the emulator
            # down before the separate failure-evidence step can run, which produced
            # empty evidence on every failure so far (runs 41349811483 / 41356511688).
            adb logcat -d -t 6000 > e2e-logcat-tail.txt 2>/dev/null || true
            adb exec-out screencap -p > e2e-final-screen.png 2>/dev/null || true
            # VERDICT — MUST be a single line. The emulator-runner executes this
            # script ONE LINE PER `sh -c` invocation (evidence: runs 41621063936 /
            # 41621713747 / 41621955951 each logged a standalone `if …; then` line
            # dying with "Syntax error: end of file unexpected (expecting fi)",
            # exit 2 — the verdict channel was corrupted for every multi-line if,
            # so even a fully green suite would have failed the job before any
            # truthful classification). One line, POSIX-safe, same semantics.
            if [ -n "$E2E_CLASS_FILTER" ]; then grep -q 'OK ([0-9][0-9]* tests)' experiment-output.txt && echo 'E2E_VERDICT_PASSED' || { echo 'E2E_VERDICT_FAILED'; exit 1; }; fi
            if [ -z "$E2E_CLASS_FILTER" ]; then VERDICT=OK; GOK=0; for GF in gate_*.txt; do grep -q 'OK ([0-9][0-9]* tests)' "$GF" && GOK=$((GOK+1)) || VERDICT=FAIL; done; [ "$GOK" -eq 6 ] || VERDICT=FAIL; for RF in regression_*.txt; do grep -q 'OK ([0-9][0-9]* tests)' "$RF" || grep -qE 'State must be at least CREATED to move to DESTROYED' "$RF" || VERDICT=FAIL; done; { grep -qE 'State must be at least CREATED to move to DESTROYED|OK \([0-9][0-9]* tests\)' residual-output.txt; } || VERDICT=FAIL; if [ "$VERDICT" = "OK" ]; then echo "E2E_VERDICT_PASSED (gate $GOK/6 green, per-class regression green-or-residual-typed, residual typed)"; else echo 'E2E_VERDICT_FAILED'; exit 1; fi; fi

      - name: Upload connected-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-voice-console-e2e-results-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            gate_*.txt
            regression_*.txt
            residual-output.txt
            experiment-output.txt
            e2e-logcat-tail.txt
            e2e-final-screen.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture failure evidence (screenshots + UI hierarchy + logcat tail)
        if: failure()
        timeout-minutes: 2
        run: |
          mkdir -p failure-evidence || true
          timeout 25 adb devices || true
          timeout 25 adb exec-out screencap -p > failure-evidence/screen.png 2>/dev/null || true
          timeout 25 adb shell uiautomator dump /sdcard/window_dump.xml 2>/dev/null || true
          timeout 25 adb pull /sdcard/window_dump.xml failure-evidence/ 2>/dev/null || true
          timeout 25 adb logcat -d -t 4000 > failure-evidence/logcat-tail.txt 2>/dev/null || true
          du -sh failure-evidence || true

      - name: Secret-clean evidence scan (no sensitive values in reports)
        if: always()
        run: |
          python3 - <<'PYEOF'
          import pathlib, re, sys
          patterns = [re.compile(p) for p in (
              r"github_pat_[A-Za-z0-9_]+", r"ghp_[A-Za-z0-9]+",
              r"PAIRING_CODE\s*=\s*\S", r"Bearer [A-Za-z0-9._-]{16,}",
          )]
          roots = [pathlib.Path("app/build/outputs/androidTest-results"),
                   pathlib.Path("residual-output.txt"),
                   pathlib.Path("experiment-output.txt")]
          roots += sorted(pathlib.Path('.').glob("gate_*.txt"))
          roots += sorted(pathlib.Path('.').glob("regression_*.txt"))
          hits = []
          for root in roots:
              if not root.exists():
                  continue
              files = root.rglob("*") if root.is_dir() else [root]
              for f in files:
                  if f.is_file():
                      try:
                          text = f.read_text(errors="ignore")
                      except Exception:
                          continue
                      for p in patterns:
                          if p.search(text):
                              hits.append(str(f))
          if hits:
              print("SENSITIVE-VALUE HITS:", hits)
              sys.exit(1)
          print("secret-clean evidence scan: PASS")
          PYEOF

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-voice-console-e2e-failure-evidence-${{ github.sha }}
          path: failure-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Shut down emulator cleanly
        if: always()
        run: |
          timeout 25 adb emu kill 2>/dev/null || true
          sleep 3
          timeout 25 adb devices || true
