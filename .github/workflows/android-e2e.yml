name: android-e2e

on:
  push:
    branches:
      - graph-2/model-manager-tower-connection-e2e
      - graph-3/monumental-oracle-tower-visual-refoundation
      - graph-4/real-voice-pairing-archive-e2e
      - main
  workflow_dispatch:
    inputs:
      e2e_profile:
        description: 'E2E variant: NORMAL = normal visual profile (frozen clock); LIFECYCLE = CI_LIFECYCLE_PROFILE (ornaments frozen in-app, real clock, physical clicks)'
        type: choice
        options:
          - NORMAL
          - LIFECYCLE
        default: NORMAL
      e2e_class_filter:
        description: 'JUnit -e class filter (empty = full suite), e.g. com.hermestower.voiceconsole.e2e.E2EAppearancePersistenceTest#e2e_35_36_switchMarbleLightAndObsidianNight'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  emulator-e2e:
    # CP-G4-023 fix 11 / R-25 (runs #132..#140 — 10 fleet deaths in 13 E2E
    # executions; #137 PROVED a healthy sample completes the whole model, #140
    # died during gate B after a GREEN gate A): the hosted emulator fleet is
    # the binding constraint, so every push now carries TWO independent fleet
    # samples (matrix). The lane failure is EXPECTED-possible and does not fail
    # the run by itself — the `e2e-verdict` job arbitrates: the run is green
    # iff AT LEAST ONE lane printed E2E_VERDICT_PASSED (a complete green sample
    # at this tip = the deciding evidence; both lanes failing honestly = no
    # evidence = the run fails). Per-lane verdicts stay fully inspectable.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    runs-on: ubuntu-latest
    # CP-G4-023 fix 5 (run 41938185541 @ a2d0b27 — CANCELLED at the 180-min cap):
    # the per-class model's arithmetic worst case is build ≈8 min + boot ≤40 min
    # + settle/installs ≤35 min + gate 6×900 s (90) + regression 6×600 s (60) +
    # residual 900 s (15) + evidence/uploads ≈15 min ≈ 263 min — the old 180-min
    # cap can never carry a full worst-case run. R-23 (fix 9) adds ONE bounded
    # ~45 s transport recovery per class boundary (13 boundaries ≈ 10 min):
    # ≈273 min worst case. R-28 (fix 14) adds ONE guest relaunch per lane
    # (launch + bounded warm boot 1200 s + settle ≈ 22 min) and ONE
    # re-invocation of the class that died with the device (≤ class budget 15
    # min): ≈337 min worst case — 340 min keeps ~23 min of margin inside the
    # hosted-runner 6-hour job ceiling.
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install pinned SDK packages (preinstalled SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-34;google_apis;x86_64" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|system-images;android-34"

      - name: Free disk space for the emulator AVD
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk* /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/Code.Tool 2>/dev/null || true
          sudo docker image prune -a -f > /dev/null 2>&1 || true
          df -h /

      - name: Check hardware acceleration availability
        run: |
          ls -l /dev/kvm || echo "NO KVM — emulator will run with software acceleration (slower boot)"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build application and test APKs
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run emulator end-to-end suite (API 34, x86_64, headless)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_PROFILE: ${{ inputs.e2e_profile || 'NORMAL' }}
          E2E_CLASS_FILTER: ${{ inputs.e2e_class_filter }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 2400
          install: false
          pre-emulator-launch-script: |
            echo "AVD config before edit:"
            cat ~/.android/avd/test.avd/config.ini || true
            sed -i 's/disk.dataPartition.size=6G/disk.dataPartition.size=2048M/' ~/.android/avd/test.avd/config.ini || true
            sed -i 's/disk.dataPartition.size=8G/disk.dataPartition.size=2048M/' ~/.android/avd/test.avd/config.ini || true
            echo "AVD config after edit:"
            grep -E "dataPartition|cachePartition" ~/.android/avd/test.avd/config.ini || true
          script: |
            adb devices
            # Post-boot settle: wait for boot flag, then give the package manager
            # time to finish first-boot finalization on the software-emulated device.
            timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
            sleep 60
            adb shell getprop ro.build.version.sdk
            echo "R-17 guest health gate before the installs..."
            # CP-G4-023 fix 7 / R-17 (run 41983695658 @ 982877c — the 8th fleet
            # death, a NEW collapse mode: emulator BOOT COMPLETED in 968 s at
            # 07:16:41, then system_server lost activity/package services within
            # ~1 min — the runner's multidisplay broadcast hit "Can't find
            # service: activity" at 07:17:27 and `adb install` failed with "cmd:
            # Can't find service: package" at 07:18:15; ZERO instrumentation
            # ran). The unguarded window is boot→install: the settle loop only
            # waits for the boot FLAG, never proving the package service is
            # usable. R-17 (the R-14/R-16 precedent: a single, typed, bounded
            # recovery for the one evidence-proven collapse mode; the REAL walk
            # unchanged, nothing deleted, skipped or weakened): probe
            # `pm list packages` — if the service is dead, adb reboot + bounded
            # re-wait (1200 s; observed cold boots 968–1110 s, warm reboots are
            # faster) + ONE re-probe; still dead → typed honest abort. Exactly
            # ONE recovery per run keeps the 300-min cap arithmetic safe
            # (worst case ≈289 min: build 8 + boot 40 + settle 6 + recovery 23
            # + installs 30 + gates 90 + regression 60 + residual 15 + evidence
            # 15). Non-collapse install failures still abort honestly with no
            # blind retry (a flake-hiding retry would be dishonest).
            if timeout 60 adb shell pm list packages >/dev/null 2>&1; then echo "R-17 GUEST_HEALTH_OK (package service alive at T+60s)"; else echo "R-17 GUEST_COLLAPSE: package service dead after boot (run 41983695658 signature: Can't find service: package 94s after boot completed) — adb reboot + bounded re-wait 1200s + one re-probe"; timeout 60 adb reboot || true; sleep 20; timeout 1200 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done' || true; sleep 60; if timeout 60 adb shell pm list packages >/dev/null 2>&1; then echo "R-17 RECOVERY_OK: guest healthy after reboot — proceeding to installs"; else echo 'E2E_BLOCKED_EMULATOR_ENVIRONMENT — guest services still dead after the single R-17 recovery (typed honest abort)'; exit 1; fi; fi
            echo "Installing application APK..."
            # CP-G4-023 fix 2 (runs 41884838553 @ c97a02f + 41883447613 @ 6545969 —
            # boot 17.4 min, then `adb: failed to stat app-debug.apk: No such file
            # or directory`): the CP-G4-021 ABI splits RENAMED the outputs — the
            # universal APK is now app-universal-debug.apk (app-debug.apk no longer
            # exists). The universal carries x86_64 (this emulator) + every ABI.
            # GRAPH 4.6 (GRAPH46_READBACK §2): installs stay bounded.
            timeout 900 adb install -r -t app/build/outputs/apk/debug/app-universal-debug.apk || { echo 'E2E_BLOCKED_EMULATOR_ENVIRONMENT — app APK install failed after the R-17 health gate (typed honest abort; the single recovery covers only the post-boot collapse window, no blind retry of non-collapse signatures)'; exit 1; }
            echo "Installing androidTest APK..."
            timeout 900 adb install -r -t $(ls app/build/outputs/apk/androidTest/debug/*androidTest*.apk | head -1) || { echo 'E2E_BLOCKED_EMULATOR_ENVIRONMENT — androidTest APK install failed after the R-17 health gate (typed honest abort)'; exit 1; }
            echo "R-24 cold-start warm-up (typed, bounded)..."
            # CP-G4-023 fix 10 / R-24 (runs #137/#138/#139 @ e89d014/29447ae/3eecf76
            # — the FIRST instrument invocation after install repeatedly consumed
            # its whole class budget on cold-start physics: #139 gate A burned
            # 900 s producing ONLY its start marker (baseline launch + recreate
            # + settle on a starved guest), #137 gate A needed 588 s total,
            # #138 A1 finished at ~747 s. The one-time costs (dexopt, first
            # layout, Onboarding flag write) are paid HERE, OUTSIDE every class
            # budget: launch (am start -W, bounded 120 s), settle 60 s,
            # force-stop (data preserved — the onboarding-complete flag stays).
            # The guest going away HERE is a typed honest abort — it would have
            # died in gate A anyway.
            timeout 120 adb shell am start -W -n com.hermestower.voiceconsole/.ui.MainActivity || { echo 'E2E_BLOCKED_EMULATOR_ENVIRONMENT — R-24 warm-up am start failed (typed honest abort)'; exit 1; }
            sleep 60
            timeout 60 adb shell am force-stop com.hermestower.voiceconsole || true
            echo "R-24 warm-up complete — proceeding to instrumentation"
            echo "Running instrumentation — segmented model (CP-G4-017 final)... profile=$E2E_PROFILE class_filter=${E2E_CLASS_FILTER:-<three-invocation model>}"
            # emulator-runner executes this script with /bin/sh (dash). The previous
            # bash-only `set -o pipefail` exited 2 before am instrument could start.
            # POSIX-safe: capture to file, echo it, classify the result.
            # CP-G4-016 (runs 41657209419/41657223032): the runner executes this
            # script ONE LINE PER `sh -c` — a shell VARIABLE built on one line is
            # DEAD by the next line. Both runs executed am instrument with EMPTY
            # args (numtests=31 despite a single-test -e class filter request; the
            # engagement probe printed ciLifecycleProfile=false) — neither the
            # class filter nor `-e lifecycleProfile true` EVER reached the device,
            # silently invalidating every dispatched experiment up to this repair.
            # CONSTRUCTION AND CONSUMPTION MUST SHARE ONE LINE.
            #
            # CP-G4-017 FINAL — SEGMENTED INSTRUMENTATION MODEL (directive §4 +
            # ITALIAN_GATE_NAVIGATION_FAILURE_LEDGER R-5/R-6): the dispositioned
            # lifecycle residual (NavBackStackEntry INITIALIZED→DESTROYED at
            # activity destroy, PHYSICAL_XIAOMI_RECOVERY_REQUIRED) crashes the
            # instrumentation PROCESS, destroying every later class's evidence.
            # Repair = crash-quarantine BY INVOCATION — nothing deleted, weakened
            # or bypassed:
            #   1) GATE: ONE INVOCATION PER CLASS (fix 4, run 41910303552: the
            #      software fleet DIED twice mid-gate (adb: device offline at
            #      ~100-110 min of the step) — a single 6-class instrument can
            #      never complete; per-class invocations give every segment
            #      independent evidence and the offline-guard stops the loop fast.
            #      ITALIAN_UI_COMPLETE requires EVERY gate class file to show
            #      'OK (… tests)' — missing evidence is NOT success;
            #   2) REGRESSION: ONE INVOCATION PER CLASS (Graph 4.6 R-11, run
            #      41868118783: the residual crashed E2EFreshInstallTest at
            #      e2e_03_04 — it is CLASS-INDEPENDENT and route-independent, so a
            #      single monolithic regression invocation can never carry the
            #      evidence of the classes ordered after the crash). Per-class
            #      classification: 'OK (… tests)' → pass; the dispositioned
            #      residual signature → typed INFRASTRUCTURE_FAILURE (recorded,
            #      does NOT fail the job — it is the dispositioned emulator
            #      residual awaiting physical arbitration); ANY other outcome
            #      FAILS the job. No test is deleted, skipped or weakened.
            #   3) RESIDUAL invocation: the dispositioned class alone — EXPECTED to
            #      show exactly the dispositioned signature (or pass when
            #      hardware-era code changes make it obsolete); ANY OTHER
            #      signature fails the job. Timeout 900 s (run 41868118783:
            #      e2e_41_42 passed and e2e_40 was mid-recreate when 600 s cut —
            #      the recreate+idle physics need headroom on software emulation).
            # Dispatch with e2e_class_filter keeps the EXACT old single-invocation
            # contract for the lifecycle experiments (TEST-A..E channel, §2).
            if [ -n "$E2E_CLASS_FILTER" ]; then IA=""; if [ "$E2E_PROFILE" = "LIFECYCLE" ]; then IA="$IA -e lifecycleProfile true"; fi; timeout 3600 adb shell am instrument -w -r $IA -e class "$E2E_CLASS_FILTER" com.hermestower.voiceconsole.test/androidx.test.runner.AndroidJUnitRunner > experiment-output.txt 2>&1; cat experiment-output.txt; fi
            # CP-G4-023 fix 14 / R-28 (run #144 42059335798 @ 7c17745 — BOTH lanes
            # died in the gate-B window ~40 min in, death #15): gate A green on
            # BOTH lanes (6th consecutive cloud sample), ColorBuffer errors
            # precede the death, and the guest becomes FULLY unreachable
            # ("could not connect to TCP port 5554: Connection refused" — the
            # EMULATOR PROCESS dies, not just the transport). The B-window is the
            # dominant kill zone (#132/#135/#140/#144). R-23's transport recovery
            # is correct for wedges and CANNOT revive a dead process. R-28 (the
            # R-14/R-17/R-23 lineage — one typed bounded recovery for an
            # evidenced collapse class): when the device is still gone after the
            # R-23 attempt, relaunch the SAME AVD ONCE per lane (file-flag
            # r28_used.flag — the runner executes this script ONE LINE PER sh -c,
            # so variables die across lines; a file survives), bounded warm boot
            # (1200 s) + settle + the R-17-style pm-list health probe; the class
            # whose invocation died WITH the device is re-invoked ONCE after the
            # relaunch and its evidence file REWRITTEN (a test that fails on the
            # relaunched guest still fails honestly — missing evidence is NOT
            # success). Cap 310→340 (worst case ≈337: build 8 + boot 40 + R-17 23
            # + settles 6 + installs 30 + warm-up 3 + gates 90 + R-23s 10 + R-28
            # 22 + re-invoke 15 + regression 60 + residual 15 + evidence 15;
            # hosted ceiling 360). No test deleted, skipped or weakened.
            if [ -z "$E2E_CLASS_FILTER" ]; then GOK=0; GBAD=""; for C in com.hermestower.voiceconsole.e2e.ItalianGateA_OnboardingConsoleTest com.hermestower.voiceconsole.e2e.ItalianGateB_ChatHistoryArchiveTest com.hermestower.voiceconsole.e2e.ItalianGateC_TowerGateQrScannerTest com.hermestower.voiceconsole.e2e.ItalianGateD_ModelsAndVoiceTest com.hermestower.voiceconsole.e2e.ItalianGateE_SettingsAppearanceLanguageTest com.hermestower.voiceconsole.e2e.ItalianGateF_DiagnosticsSelfTestAboutTest; do if ! adb get-state >/dev/null 2>&1; then echo "R-23 transport recovery attempt (bounded ~45s)..."; adb reconnect offline >/dev/null 2>&1 || true; sleep 15; adb kill-server >/dev/null 2>&1 || true; adb start-server >/dev/null 2>&1 || true; sleep 10; if ! adb get-state >/dev/null 2>&1; then if [ ! -f r28_used.flag ]; then touch r28_used.flag; echo "R-28 GUEST_RELAUNCH (boundary — R-23 could not recover; relaunching the SAME AVD, apps persist in userdata)..."; pkill -f "qemu-system-x86_64" 2>/dev/null || true; nohup "$ANDROID_HOME/emulator/emulator" -avd test -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -port 5554 > emulator-relaunch.log 2>&1 & sleep 20; adb kill-server >/dev/null 2>&1 || true; adb start-server >/dev/null 2>&1 || true; if timeout 1200 bash -c 'adb wait-for-device; until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'; then sleep 60; else echo "R-28 UNBOOTED — guest did not reach boot_completed within the bound (typed honest abort)"; fi; fi; fi; fi; if adb get-state >/dev/null 2>&1; then F="gate_$(echo "$C" | sed 's/.*ItalianGate//;s/_.*//').txt"; timeout 900 adb shell am instrument -w -r -e class "$C" com.hermestower.voiceconsole.test/androidx.test.runner.AndroidJUnitRunner > "$F" 2>&1; cat "$F"; if ! grep -qE 'OK \([0-9][0-9]* tests?\)' "$F"; then if ! adb get-state >/dev/null 2>&1; then echo "R-23 transport recovery attempt after the class died with the device (bounded ~45s)..."; adb reconnect offline >/dev/null 2>&1 || true; sleep 15; adb kill-server >/dev/null 2>&1 || true; adb start-server >/dev/null 2>&1 || true; sleep 10; if ! adb get-state >/dev/null 2>&1; then if [ ! -f r28_used.flag ]; then touch r28_used.flag; echo "R-28 GUEST_RELAUNCH (class died with the device — relaunching the SAME AVD)..."; pkill -f "qemu-system-x86_64" 2>/dev/null || true; nohup "$ANDROID_HOME/emulator/emulator" -avd test -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -port 5554 > emulator-relaunch.log 2>&1 & sleep 20; adb kill-server >/dev/null 2>&1 || true; adb start-server >/dev/null 2>&1 || true; if timeout 1200 bash -c 'adb wait-for-device; until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'; then sleep 60; if timeout 60 adb shell pm list packages >/dev/null 2>&1; then echo "R-28 RECOVERY_OK — re-invoking the interrupted class ONCE (the invocation died WITH the device; the file is REWRITTEN — a fail on the relaunched guest still fails honestly)"; timeout 900 adb shell am instrument -w -r -e class "$C" com.hermestower.voiceconsole.test/androidx.test.runner.AndroidJUnitRunner > "$F" 2>&1; cat "$F"; else echo "R-28 UNHEALTHY — guest relaunched but the package service is dead (typed honest abort)"; fi; else echo "R-28 UNBOOTED — guest did not reach boot_completed within the bound (typed honest abort)"; fi; fi; fi; fi; fi; if grep -qE 'OK \([0-9][0-9]* tests?\)' "$F"; then GOK=$((GOK+1)); else GBAD="$GBAD $C"; fi; else echo "DEVICE_OFFLINE_ABORT — class $C has no runnable device after R-23 and the single R-28 relaunch (typed E2E_BLOCKED_EMULATOR_ENVIRONMENT)"; break; fi; done; echo "GATE_TALLY classes_ok=$GOK of 6 classes_failed:[$GBAD]"; fi
            if [ -z "$E2E_CLASS_FILTER" ]; then RC_OK=0; RC_RESIDUAL=0; RC_FAILED=""; for C in com.hermestower.voiceconsole.e2e.E2EFreshInstallTest com.hermestower.voiceconsole.e2e.E2ELifecycleProfileTest com.hermestower.voiceconsole.e2e.E2EModelManagerTest com.hermestower.voiceconsole.e2e.E2EOnboardingTest com.hermestower.voiceconsole.e2e.E2ESelfTestTest com.hermestower.voiceconsole.e2e.E2EVoiceFlowTest; do if ! adb get-state >/dev/null 2>&1; then echo "R-23 transport recovery attempt (bounded ~45s)..."; adb reconnect offline >/dev/null 2>&1 || true; sleep 15; adb kill-server >/dev/null 2>&1 || true; adb start-server >/dev/null 2>&1 || true; sleep 10; if ! adb get-state >/dev/null 2>&1; then if [ ! -f r28_used.flag ]; then touch r28_used.flag; echo "R-28 GUEST_RELAUNCH (regression boundary — relaunching the SAME AVD, apps persist in userdata)..."; pkill -f "qemu-system-x86_64" 2>/dev/null || true; nohup "$ANDROID_HOME/emulator/emulator" -avd test -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -port 5554 > emulator-relaunch.log 2>&1 & sleep 20; adb kill-server >/dev/null 2>&1 || true; adb start-server >/dev/null 2>&1 || true; if timeout 1200 bash -c 'adb wait-for-device; until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'; then sleep 60; else echo "R-28 UNBOOTED — typed honest abort"; fi; fi; fi; fi; if ! adb get-state >/dev/null 2>&1; then echo "DEVICE_OFFLINE_ABORT — remaining regression classes have no runnable device after R-23 and the single R-28 relaunch (typed E2E_BLOCKED_EMULATOR_ENVIRONMENT)"; break; fi; F="regression_$(echo "$C" | sed 's/.*\.//').txt"; IA=""; if [ "$E2E_PROFILE" = "LIFECYCLE" ]; then IA="-e lifecycleProfile true"; fi; timeout 600 adb shell am instrument -w -r $IA -e class "$C" com.hermestower.voiceconsole.test/androidx.test.runner.AndroidJUnitRunner > "$F" 2>&1; cat "$F"; if ! grep -qE 'OK \([0-9][0-9]* tests?\)' "$F" && ! grep -qE 'State must be at least CREATED to move to DESTROYED' "$F"; then if ! adb get-state >/dev/null 2>&1; then echo "R-23 transport recovery attempt after the class died with the device (bounded ~45s)..."; adb reconnect offline >/dev/null 2>&1 || true; sleep 15; adb kill-server >/dev/null 2>&1 || true; adb start-server >/dev/null 2>&1 || true; sleep 10; if ! adb get-state >/dev/null 2>&1; then if [ ! -f r28_used.flag ]; then touch r28_used.flag; echo "R-28 GUEST_RELAUNCH (regression class died with the device)..."; pkill -f "qemu-system-x86_64" 2>/dev/null || true; nohup "$ANDROID_HOME/emulator/emulator" -avd test -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -port 5554 > emulator-relaunch.log 2>&1 & sleep 20; adb kill-server >/dev/null 2>&1 || true; adb start-server >/dev/null 2>&1 || true; if timeout 1200 bash -c 'adb wait-for-device; until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'; then sleep 60; if timeout 60 adb shell pm list packages >/dev/null 2>&1; then echo "R-28 RECOVERY_OK — re-invoking the interrupted regression class ONCE (the invocation died WITH the device; the file is REWRITTEN)"; timeout 600 adb shell am instrument -w -r $IA -e class "$C" com.hermestower.voiceconsole.test/androidx.test.runner.AndroidJUnitRunner > "$F" 2>&1; cat "$F"; else echo "R-28 UNHEALTHY — guest relaunched but the package service is dead (typed honest abort)"; fi; else echo "R-28 UNBOOTED — typed honest abort"; fi; fi; fi; fi; fi; if grep -qE 'OK \([0-9][0-9]* tests?\)' "$F"; then RC_OK=$((RC_OK+1)); elif grep -qE 'State must be at least CREATED to move to DESTROYED' "$F"; then RC_RESIDUAL=$((RC_RESIDUAL+1)); else RC_FAILED="$RC_FAILED $C"; fi; done; echo "REGRESSION_TALLY classes_ok=$RC_OK classes_residual_typed=$RC_RESIDUAL classes_failed:[$RC_FAILED]"; fi
            if [ -z "$E2E_CLASS_FILTER" ]; then if ! adb get-state >/dev/null 2>&1; then echo "R-23 transport recovery attempt (bounded ~45s)..."; adb reconnect offline >/dev/null 2>&1 || true; sleep 15; adb kill-server >/dev/null 2>&1 || true; adb start-server >/dev/null 2>&1 || true; sleep 10; if ! adb get-state >/dev/null 2>&1; then if [ ! -f r28_used.flag ]; then touch r28_used.flag; echo "R-28 GUEST_RELAUNCH (residual guard — relaunching the SAME AVD)..."; pkill -f "qemu-system-x86_64" 2>/dev/null || true; nohup "$ANDROID_HOME/emulator/emulator" -avd test -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -port 5554 > emulator-relaunch.log 2>&1 & sleep 20; adb kill-server >/dev/null 2>&1 || true; adb start-server >/dev/null 2>&1 || true; if timeout 1200 bash -c 'adb wait-for-device; until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'; then sleep 60; else echo "R-28 UNBOOTED — typed honest abort"; fi; fi; fi; fi; fi; if [ -z "$E2E_CLASS_FILTER" ]; then if adb get-state >/dev/null 2>&1; then timeout 900 adb shell am instrument -w -r -e class com.hermestower.voiceconsole.e2e.E2EAppearancePersistenceTest com.hermestower.voiceconsole.test/androidx.test.runner.AndroidJUnitRunner > residual-output.txt 2>&1; if ! grep -qE 'State must be at least CREATED to move to DESTROYED|OK \([0-9][0-9]* tests?\)' residual-output.txt && ! adb get-state >/dev/null 2>&1 && [ ! -f r28_used.flag ]; then touch r28_used.flag; echo "R-28 GUEST_RELAUNCH (residual died with the device — one relaunch + ONE re-invocation)..."; pkill -f "qemu-system-x86_64" 2>/dev/null || true; nohup "$ANDROID_HOME/emulator/emulator" -avd test -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -port 5554 > emulator-relaunch.log 2>&1 & sleep 20; adb kill-server >/dev/null 2>&1 || true; adb start-server >/dev/null 2>&1 || true; if timeout 1200 bash -c 'adb wait-for-device; until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'; then sleep 60; if timeout 60 adb shell pm list packages >/dev/null 2>&1; then echo "R-28 RECOVERY_OK — re-invoking the residual ONCE (the invocation died WITH the device; the file is REWRITTEN)"; timeout 900 adb shell am instrument -w -r -e class com.hermestower.voiceconsole.e2e.E2EAppearancePersistenceTest com.hermestower.voiceconsole.test/androidx.test.runner.AndroidJUnitRunner > residual-output.txt 2>&1; else echo "R-28 UNHEALTHY — typed honest abort"; fi; else echo "R-28 UNBOOTED — typed honest abort"; fi; fi; else echo 'DEVICE_OFFLINE_ABORT — residual invocation has no runnable device after R-23 and the single R-28 relaunch (typed E2E_BLOCKED_EMULATOR_ENVIRONMENT)' > residual-output.txt; fi; cat residual-output.txt; fi
            # Evidence capture INSIDE the script step: the runner tears the emulator
            # down before the separate failure-evidence step can run, which produced
            # empty evidence on every failure so far (runs 41349811483 / 41356511688).
            # CP-G4-023 fix 5 (run 41938185541 @ a2d0b27): `adb logcat -d` against a
            # DEAD fleet HANGS FOREVER — the device died during gate B, the residual
            # invocation returned fast, and this UNBOUNDED logcat line then consumed
            # 2 h 22 min until the 3 h job cap cancelled the run BEFORE the verdict
            # could even print. Both capture lines are now bounded at 60 s; a dead
            # device costs one minute, not the run.
            timeout 60 adb logcat -d -t 6000 > e2e-logcat-tail.txt 2>/dev/null || true
            timeout 60 adb exec-out screencap -p > e2e-final-screen.png 2>/dev/null || true
            # VERDICT — MUST be a single line. The emulator-runner executes this
            # script ONE LINE PER `sh -c` invocation (evidence: runs 41621063936 /
            # 41621713747 / 41621955951 each logged a standalone `if …; then` line
            # dying with "Syntax error: end of file unexpected (expecting fi)",
            # exit 2 — the verdict channel was corrupted for every multi-line if,
            # so even a fully green suite would have failed the job before any
            # truthful classification). One line, POSIX-safe, same semantics.
            if [ -n "$E2E_CLASS_FILTER" ]; then grep -qE 'OK \([0-9][0-9]* tests?\)' experiment-output.txt && { echo 'E2E_VERDICT_PASSED'; echo 'E2E_VERDICT_PASSED' > VERDICT.txt; } || { echo 'E2E_VERDICT_FAILED'; echo 'E2E_VERDICT_FAILED' > VERDICT.txt; exit 1; }; fi
            if [ -z "$E2E_CLASS_FILTER" ]; then VERDICT=OK; GOK=0; for GF in gate_*.txt; do grep -qE 'OK \([0-9][0-9]* tests?\)' "$GF" && GOK=$((GOK+1)) || VERDICT=FAIL; done; [ "$GOK" -eq 6 ] || VERDICT=FAIL; for RF in regression_*.txt; do grep -qE 'OK \([0-9][0-9]* tests?\)' "$RF" || grep -qE 'State must be at least CREATED to move to DESTROYED' "$RF" || VERDICT=FAIL; done; { grep -qE 'State must be at least CREATED to move to DESTROYED|OK \([0-9][0-9]* tests?\)' residual-output.txt; } || VERDICT=FAIL; if [ "$VERDICT" = "OK" ]; then echo "E2E_VERDICT_PASSED (gate $GOK/6 green, per-class regression green-or-residual-typed, residual typed)"; echo 'E2E_VERDICT_PASSED' > VERDICT.txt; else echo 'E2E_VERDICT_FAILED'; echo 'E2E_VERDICT_FAILED' > VERDICT.txt; exit 1; fi; fi

      - name: Upload connected-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-voice-console-e2e-results-sample-${{ matrix.sample }}-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            gate_*.txt
            regression_*.txt
            residual-output.txt
            experiment-output.txt
            e2e-logcat-tail.txt
            e2e-final-screen.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture failure evidence (screenshots + UI hierarchy + logcat tail)
        if: failure()
        timeout-minutes: 2
        run: |
          mkdir -p failure-evidence || true
          timeout 25 adb devices || true
          timeout 25 adb exec-out screencap -p > failure-evidence/screen.png 2>/dev/null || true
          timeout 25 adb shell uiautomator dump /sdcard/window_dump.xml 2>/dev/null || true
          timeout 25 adb pull /sdcard/window_dump.xml failure-evidence/ 2>/dev/null || true
          timeout 25 adb logcat -d -t 4000 > failure-evidence/logcat-tail.txt 2>/dev/null || true
          du -sh failure-evidence || true

      - name: Secret-clean evidence scan (no sensitive values in reports)
        if: always()
        run: |
          python3 - <<'PYEOF'
          import pathlib, re, sys
          patterns = [re.compile(p) for p in (
              r"github_pat_[A-Za-z0-9_]+", r"ghp_[A-Za-z0-9]+",
              r"PAIRING_CODE\s*=\s*\S", r"Bearer [A-Za-z0-9._-]{16,}",
          )]
          roots = [pathlib.Path("app/build/outputs/androidTest-results"),
                   pathlib.Path("residual-output.txt"),
                   pathlib.Path("experiment-output.txt")]
          roots += sorted(pathlib.Path('.').glob("gate_*.txt"))
          roots += sorted(pathlib.Path('.').glob("regression_*.txt"))
          hits = []
          for root in roots:
              if not root.exists():
                  continue
              files = root.rglob("*") if root.is_dir() else [root]
              for f in files:
                  if f.is_file():
                      try:
                          text = f.read_text(errors="ignore")
                      except Exception:
                          continue
                      for p in patterns:
                          if p.search(text):
                              hits.append(str(f))
          if hits:
              print("SENSITIVE-VALUE HITS:", hits)
              sys.exit(1)
          print("secret-clean evidence scan: PASS")
          PYEOF

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-voice-console-e2e-failure-evidence-sample-${{ matrix.sample }}-${{ github.sha }}
          path: failure-evidence/

      - name: Upload per-lane verdict (the arbitration channel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-verdict-sample-${{ matrix.sample }}
          path: VERDICT.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Shut down emulator cleanly
        if: always()
        run: |
          timeout 25 adb emu kill 2>/dev/null || true
          sleep 3
          timeout 25 adb devices || true

  # CP-G4-023 fix 11 / R-25 — the arbitration channel. The emulator-e2e lanes
  # carry `continue-on-error` (an infrastructure death in one lane must not
  # mask the other lane's complete green sample). THIS job decides the run:
  # green iff AT LEAST ONE independent fleet sample at this tip printed
  # E2E_VERDICT_PASSED (a complete 6/6-gate + regression + residual green
  # sample = the deciding evidence per the GRAPH 4.6 discipline); both lanes
  # failing (typed or otherwise) = no evidence = the run fails honestly.
  e2e-verdict:
    needs: emulator-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download both per-lane verdicts
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-verdict-sample-*
          path: verdicts
      - name: Arbitrate — at least one complete green fleet sample?
        run: |
          echo "Per-lane verdicts found:"
          find verdicts -name "VERDICT.txt" -type f -print -exec cat {} \; || true
          if grep -rq "E2E_VERDICT_PASSED" verdicts/ 2>/dev/null; then echo "E2E_VERDICT_PASSED (at least one independent fleet sample completed the full model green at this tip)"; else echo "E2E_VERDICT_FAILED — no fleet sample completed the full model (infrastructure sampling exhausted on this push; next typed row + narrow repair + full rerun per the discipline)"; exit 1; fi
